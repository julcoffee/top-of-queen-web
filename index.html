<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#171321">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<!-- 모바일 앱처럼 (2026-11-11 · G123식 바로 플레이): 홈 화면 아이콘 · 주소창 없는 화면 · 아이폰 홈 화면 앱 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Top of Queen">
<title>Top of Queen · 이솔</title>
<meta name="description" content="이솔과 대화하고 방송과 연습을 함께하는 체험판 · 설치 없이 바로 플레이">
<style>
  /* 시작 화면: 홈 화면 그림 위에 제목 · 만나러 가기 버튼 · 안내. 누르면 그때 게임을 받는다 (두 번째부터·홈 화면 앱은 바로 시작).
     게임 화면은 세로 9:16 — 남는 자리(휴대폰 위아래 · PC 양옆)는 흐린 그림으로 채운다. 노치·홈 막대(safe area)는 비운다. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
  body { color: #fff; font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #111019; }
  #backdrop { position: fixed; inset: -40px; background: url(preview.png) center / cover no-repeat; filter: blur(26px) saturate(1.15); opacity: .5; }
  #backdrop::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #3e294c66, #111019e6 75%); }
  #safe { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
          bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); pointer-events: none; }
  #game { position: fixed; overflow: hidden; border-radius: 18px; background: #12111b; box-shadow: 0 20px 100px #0008; }
  #game.phone { border-radius: 0; box-shadow: none; }
  #unity-canvas { width: 100%; height: 100%; display: block; outline: none; background: #12111b; touch-action: none; }
  #loading { position: absolute; inset: 0; overflow: hidden; }
  #loading > img { width: 100%; height: 100%; object-fit: cover; filter: blur(1px); opacity: .66; }
  .shade { position: absolute; inset: 0; background: linear-gradient(0deg, #171321 8%, #171321f5 24%, #17132110 78%); }
  .intro { position: absolute; left: 8%; right: 8%; bottom: 5%; }
  .eyebrow { font-size: 10px; letter-spacing: .25em; color: #e9bfd7; }
  h1 { font-size: clamp(35px, 6vh, 57px); line-height: .94; letter-spacing: -.05em; font-weight: 300; margin: 14px 0 18px; }
  h1 strong { font-weight: 850; }
  p { font-size: 14px; color: #ddd1e6; margin: 0; }
  #play { cursor: pointer; border: 0; color: #fff; background: #ed569a; border-radius: 16px; font-size: 16px; font-weight: 700;
          padding: 18px 22px; width: 100%; margin: 15px 0 0; box-shadow: 0 8px 25px #ed569a38; font-family: inherit; text-align: left; }
  #play span { float: right; }
  #play:hover { background: #fb67aa; }
  #play:disabled { opacity: .6; cursor: wait; }
  #progress { height: 4px; background: #ffffff20; border-radius: 4px; margin-top: 18px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: #f8a0cf; transition: width .2s; }
  #status { font-size: 12px; margin: 12px 0 0; }
  #install-chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 8px 12px; border-radius: 99px;
                  border: 1px solid #ffffff38; background: #ffffff14; color: #fff; font: 600 13px/1 inherit; font-family: inherit; cursor: pointer; }
  #install-chip svg { width: 16px; height: 16px; }
  small { display: block; color: #b4a4c1; font-size: 10px; line-height: 1.8; margin: 12px 0 0; }
  #error { position: absolute; inset: 0; background: #171321eb; padding: 45% 9% 10%; }
  #error p { line-height: 1.8; }
  #error button { cursor: pointer; border: 0; color: #fff; background: #ed569a; border-radius: 14px; font-size: 15px; font-weight: 700;
                  padding: 14px 20px; width: 100%; margin-top: 16px; font-family: inherit; }
  footer { position: fixed; bottom: 3px; left: 0; right: 0; text-align: center; font-size: 10px; color: #9d91a6; letter-spacing: .02em; }
  footer span { padding: 0 5px; }
  footer.hide { display: none; }

  /* 떠 있는 메뉴 공 (G123식) — 끌어서 옮길 수 있음 · 휴대폰 위아래에 빈자리가 있으면 그 자리에 둔다 */
  #ball { position: fixed; z-index: 30; width: 46px; height: 46px; border-radius: 50%; border: 2px solid #ffffffd0; padding: 0;
          background: url(icons/icon-192.png) center / cover, #ed569a; box-shadow: 0 4px 16px #0007; opacity: .72; cursor: grab; touch-action: none; }
  #ball:active, #ball.drag { opacity: 1; cursor: grabbing; }
  #ball::after { content: ""; position: absolute; right: -2px; top: -2px; width: 12px; height: 12px; border-radius: 50%;
                 background: #ffd166; border: 2px solid #171321; display: var(--dot, none); }

  /* 아래에서 올라오는 메뉴 (엄지로 누르기 쉽게 · 줄 하나 56px) */
  #sheet-dim { position: fixed; inset: 0; z-index: 40; background: #0009; opacity: 0; transition: opacity .2s; }
  #sheet { position: fixed; z-index: 41; left: 50%; bottom: 0; width: min(100%, 480px); transform: translate(-50%, 105%); transition: transform .24s ease-out;
           background: #201a2c; border-radius: 22px 22px 0 0; padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px));
           box-shadow: 0 -10px 40px #0008; color: #f3ecfb; }
  #sheet.open { transform: translate(-50%, 0); }
  #sheet-dim.open { opacity: 1; }
  .grip { width: 40px; height: 5px; border-radius: 3px; background: #ffffff38; margin: 2px auto 12px; }
  .sheet-title { display: flex; align-items: center; gap: 12px; margin: 0 4px 10px; }
  .sheet-title img { width: 40px; height: 40px; border-radius: 10px; }
  .sheet-title b { font-size: 17px; display: block; }
  .sheet-title span { font-size: 12px; color: #b9aacb; }
  .row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 0 14px; margin: 6px 0; border: 0; border-radius: 14px;
         background: #2c2439; color: #fff; font: 600 16px/1.3 inherit; font-family: inherit; text-align: left; cursor: pointer; text-decoration: none; }
  .row svg { width: 22px; height: 22px; flex: none; color: #f8a0cf; }
  .row em { margin-left: auto; font-style: normal; font-size: 12px; font-weight: 500; color: #b9aacb; }
  .row.main { background: #ed569a; }
  .row.main svg { color: #fff; }
  .note { font-size: 12.5px; line-height: 1.7; color: #b9aacb; margin: 10px 4px 2px; }
  .steps { margin: 4px 0 6px; padding: 0; list-style: none; counter-reset: s; }
  .steps li { counter-increment: s; display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 15.5px; line-height: 1.45; }
  .steps li::before { content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 50%; background: #ed569a; color: #fff;
                      font-size: 13px; font-weight: 800; display: grid; place-items: center; }
  .steps svg { width: 20px; height: 20px; vertical-align: -4px; color: #8fd6ff; }

  /* 휴대폰을 가로로 들었을 때 (게임은 세로) */
  #rotate { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; text-align: center; background: #171321f2; font-size: 16px; line-height: 1.7; }
  #rotate svg { width: 54px; height: 54px; color: #f8a0cf; margin-bottom: 10px; }
  @media (pointer: coarse) and (orientation: landscape) and (max-height: 540px) { #rotate { display: grid; } }
  [hidden] { display: none !important; }
  #toq-account-nav { display: none !important; }   /* 암호판 Worker가 붙이는 맨 위 줄 → 메뉴 공 안으로 옮김 */
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="safe"></div>
<main id="game">
  <canvas id="unity-canvas" tabindex="-1" aria-label="Top of Queen 게임"></canvas>
  <section id="loading">
    <img src="preview.png" alt="홈에서 기다리는 이솔">
    <div class="shade"></div>
    <div class="intro">
      <span class="eyebrow">A NEW DAY WITH ISOL</span>
      <h1>TOP OF<br><strong>QUEEN</strong></h1>
      <p>오늘의 이야기부터, 다음 무대까지.</p>
      <button id="play">이솔 만나러 가기 <span>→</span></button>
      <div id="progress" hidden><div id="bar"></div></div>
      <p id="status" role="status">설치 없이 바로 플레이</p>
      <button id="install-chip" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M12 8v6M9 11h6"/></svg>홈 화면에 추가하면 앱처럼 열려요</button>
      <small>대화·방송·육성을 체험하는 프로토타입<br><span id="ai-note">1:1 대화의 자유 입력에는 준비된 대사로 답해요.</span><br>진행과 대화 기록은 이 기기·이 브라우저에 저장됩니다. 글을 쓸 때는 브라우저 입력창이 열려요.</small>
    </div>
  </section>
  <div id="error" hidden><p id="error-text"></p><button onclick="location.reload()">다시 열기</button></div>
</main>
<footer id="footer">TOP OF QUEEN <span>·</span> 이솔과 함께하는 체험판</footer>

<button id="ball" type="button" aria-label="메뉴 열기" hidden></button>
<div id="sheet-dim" hidden></div>
<section id="sheet" role="dialog" aria-modal="true" aria-label="메뉴" hidden>
  <div class="grip"></div>
  <div id="sheet-body"></div>
</section>

<div id="rotate"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg><br>휴대폰을 세로로 돌려 주세요<br><span style="font-size:13px;color:#b9aacb">Top of Queen은 세로 화면 게임이에요</span></div></div>
<script>
  var game = document.querySelector("#game");
  var canvas = document.querySelector("#unity-canvas");
  var safe = document.querySelector("#safe");
  var ball = document.querySelector("#ball");
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.matchMedia("(display-mode: fullscreen)").matches || navigator.standalone === true;
  var isTouch = window.matchMedia("(pointer: coarse)").matches;
  var started = false, installPrompt = null, wakeLock = null;
  function store(key, value) { try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; } }

  // ---------------------------------------------------------------- 화면 맞추기
  // 세로 540×960 기준 — 노치·홈 막대를 뺀 자리 안에서 9:16으로 꽉 차게. 넓은 화면(PC)은 위아래 3% 여백 + 둥근 모서리.
  function fit() {
    var box = safe.getBoundingClientRect();
    var phone = window.innerWidth <= 600 || (isTouch && window.innerWidth < window.innerHeight);
    var w = box.width, h = box.height * (phone ? 1 : .94);
    var gw = Math.floor(Math.min(w, h * 9 / 16)), gh = Math.floor(gw * 16 / 9);
    game.style.width = gw + "px";
    game.style.height = gh + "px";
    game.style.left = Math.round(box.left + (box.width - gw) / 2) + "px";
    game.style.top = Math.round(box.top + (box.height - gh) / 2) + "px";
    game.classList.toggle("phone", phone);
    document.querySelector("#footer").classList.toggle("hide", phone || started);
    placeBall();
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function () { setTimeout(fit, 250); });
  document.addEventListener("fullscreenchange", fit);
  window.addEventListener("load", fit);
  fit();
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });   // 아이폰 두 손가락 확대 막기

  // ---------------------------------------------------------------- 메뉴 공
  // 게임 위아래(또는 양옆)에 공이 들어갈 빈자리가 있으면 거기, 없으면 화면 가장자리(끌어 옮긴 자리 기억).
  function placeBall() {
    if (ball.hidden) return;
    var g = game.getBoundingClientRect(), size = 46, gap = 8;
    var saved = parseFloat(store("toq.ball.y")), side = store("toq.ball.side") || "left";
    if (g.top >= size + gap * 2) { ball.style.left = Math.round(g.left + gap) + "px"; ball.style.top = Math.round(g.top - size - gap) + "px"; return; }
    if (g.left >= size + gap * 2) { ball.style.left = Math.round(g.left - size - gap) + "px"; ball.style.top = Math.round(g.top + gap) + "px"; return; }
    var y = isNaN(saved) ? .5 : saved;
    ball.style.top = Math.round(Math.max(8, Math.min(window.innerHeight - size - 8, y * window.innerHeight - size / 2))) + "px";
    ball.style.left = (side === "left" ? 4 : window.innerWidth - size - 4) + "px";
  }
  (function () {
    var down = null, moved = false;
    ball.addEventListener("pointerdown", function (e) { down = { x: e.clientX, y: e.clientY, l: ball.offsetLeft, t: ball.offsetTop }; moved = false; ball.setPointerCapture(e.pointerId); });
    ball.addEventListener("pointermove", function (e) {
      if (!down) return;
      var dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (!moved && dx * dx + dy * dy < 64) return;
      moved = true; ball.classList.add("drag");
      ball.style.left = (down.l + dx) + "px"; ball.style.top = (down.t + dy) + "px";
    });
    ball.addEventListener("pointerup", function (e) {
      if (!down) return;
      ball.classList.remove("drag");
      if (moved) {
        store("toq.ball.side", e.clientX < window.innerWidth / 2 ? "left" : "right");
        store("toq.ball.y", String(Math.max(.05, Math.min(.95, e.clientY / window.innerHeight))));
        placeBall();   // 빈자리가 있으면 그 자리로 돌아가고, 없으면 놓은 쪽 가장자리에 붙는다
      } else openMenu();
      down = null;
    });
  })();

  // ---------------------------------------------------------------- 아래 메뉴
  var icons = {
    install: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M12 8v6M9 11h6"/></svg>',
    full: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>',
    reload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5v10h14V11h-1"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
    dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>'
  };
  function row(icon, text, hint, action, main) {
    var b = document.createElement(typeof action === "string" ? "a" : "button");
    b.className = "row" + (main ? " main" : "");
    if (typeof action === "string") b.href = action; else { b.type = "button"; b.onclick = action; }
    b.innerHTML = icons[icon] + "<span></span>" + (hint ? "<em></em>" : "");
    b.querySelector("span").textContent = text;
    if (hint) b.querySelector("em").textContent = hint;
    return b;
  }
  function note(text) { var p = document.createElement("p"); p.className = "note"; p.textContent = text; return p; }
  function showSheet(nodes) {
    var body = document.querySelector("#sheet-body");
    body.replaceChildren.apply(body, nodes);
    var sheet = document.querySelector("#sheet"), dim = document.querySelector("#sheet-dim");
    sheet.hidden = dim.hidden = false;
    requestAnimationFrame(function () { sheet.classList.add("open"); dim.classList.add("open"); });
  }
  function closeSheet() {
    var sheet = document.querySelector("#sheet"), dim = document.querySelector("#sheet-dim");
    sheet.classList.remove("open"); dim.classList.remove("open");
    setTimeout(function () { if (!sheet.classList.contains("open")) sheet.hidden = dim.hidden = true; if (started) canvas.focus(); }, 240);
  }
  document.querySelector("#sheet-dim").onclick = closeSheet;
  function title(sub) {
    var t = document.createElement("div"); t.className = "sheet-title";
    t.innerHTML = '<img src="icons/icon-192.png" alt=""><div><b>Top of Queen</b><span></span></div>';
    t.querySelector("span").textContent = sub;
    return t;
  }
  function canFullscreen() { return !!(document.documentElement.requestFullscreen && document.fullscreenEnabled) && !(isIOS && isStandalone); }
  function openMenu() {
    var nodes = [title(isStandalone ? "홈 화면 앱으로 실행 중" : "브라우저에서 실행 중")];
    if (!isStandalone) nodes.push(row("install", "홈 화면에 추가", "앱처럼 열기", openInstall, true));
    if (canFullscreen()) nodes.push(row("full", document.fullscreenElement ? "전체 화면 끝내기" : "전체 화면", "", toggleFullscreen));
    var nav = document.querySelector("#toq-account-nav a");
    if (nav) nodes.push(row("chat", "내 대화·기억", "다른 기기와 이어 가기", nav.getAttribute("href")));
    nodes.push(row("reload", "다시 불러오기", "멈췄을 때", function () { location.reload(); }));
    nodes.push(row("close", "닫기", "", closeSheet));
    nodes.push(note("진행은 이 기기·이 브라우저에 저장돼요." + (isIOS && isStandalone ? " 홈 화면 앱은 사파리와 저장이 따로예요." : "")));
    showSheet(nodes);
  }
  function openInstall() {
    var nodes = [title("홈 화면에 추가하면 주소창 없이 앱처럼 열려요")];
    if (installPrompt) {
      nodes.push(row("install", "홈 화면에 추가", "", function () {
        installPrompt.prompt();
        installPrompt.userChoice.then(function () { installPrompt = null; closeSheet(); });
      }, true));
    } else {
      var ol = document.createElement("ol"); ol.className = "steps";
      var lines = isIOS
        ? ["화면 " + (/iPad/.test(ua) || navigator.maxTouchPoints > 1 && !/iPhone/.test(ua) ? "위" : "아래") + "의 공유 버튼 " + icons.share + " 누르기",
           "목록을 내려서 '홈 화면에 추가' " + icons.plus + " 누르기",
           "오른쪽 위 '추가' 누르기"]
        : ["브라우저 메뉴 " + icons.dots + " 누르기",
           "'홈 화면에 추가' 또는 '앱 설치' 누르기",
           "'설치'(또는 '추가') 누르기"];
      lines.forEach(function (html) { var li = document.createElement("li"); li.innerHTML = "<span>" + html + "</span>"; ol.appendChild(li); });
      nodes.push(ol);
    }
    if (isIOS) nodes.push(note("아이폰은 홈 화면 앱과 사파리의 저장이 따로예요. 홈 화면 앱에서는 처음부터 시작하고, 암호판이면 암호를 한 번 더 넣어요."));
    nodes.push(row("close", "닫기", "", closeSheet));
    showSheet(nodes);
  }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); installPrompt = e; });
  window.addEventListener("appinstalled", function () { installPrompt = null; document.querySelector("#install-chip").hidden = true; });
  function toggleFullscreen() {
    closeSheet();
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    document.documentElement.requestFullscreen({ navigationUI: "hide" }).then(function () {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock("portrait").catch(function () {});
    }).catch(function () {});
  }
  if (!isStandalone) {
    var chip = document.querySelector("#install-chip");
    chip.hidden = false;
    chip.onclick = openInstall;
  }

  // 방송을 보는 동안 화면이 꺼지지 않게 (안드로이드 크롬 · 아이폰 16.4 이상)
  function keepAwake() {
    if (!started || !navigator.wakeLock || document.visibilityState !== "visible") return;
    navigator.wakeLock.request("screen").then(function (lock) { wakeLock = lock; }).catch(function () {});
  }
  document.addEventListener("visibilitychange", keepAwake);

  // ---------------------------------------------------------------- 게임 받기
  // AI 대화 서버(/api/chat)가 같은 사이트에 있을 때만 AI 안내를 보여 준다 (GitHub Pages처럼 없으면 404 → 준비된 대사 안내 그대로)
  fetch("/api/chat", { method: "GET", cache: "no-store" }).then(function (r) {
    if (r.status !== 404) document.querySelector("#ai-note").textContent = "AI 대화 입력은 답변 생성을 위해 fal로 전송됩니다.";
  }).catch(function () {});

  function progress(text, amount) {
    document.querySelector("#status").textContent = text;
    document.querySelector("#bar").style.width = Math.round(Math.min(1, amount) * 100) + "%";
  }
  function showError(message) {
    var text = String(message || "");
    if (/memory|OOM|allocate/i.test(text)) text = "기기 메모리가 부족해요. 다른 앱·탭을 닫고 다시 열어 주세요. (" + text.slice(0, 80) + ")";
    document.querySelector("#error-text").textContent = "문제가 생겼어요: " + text;
    document.querySelector("#error").hidden = false;
  }
  function unityShowBanner(message, type) { if (type === "error") showError(message); else console.warn(message); }

  var buildUrl = "Build";
  var loaderUrl = buildUrl + "/out.loader.js";
  var config = {
    dataUrl: buildUrl + "/out.data.unityweb",
    frameworkUrl: buildUrl + "/out.framework.js.unityweb",
    codeUrl: buildUrl + "/out.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "TopOfQueen",
    productName: "Top of Queen",
    productVersion: "0.1.0",
    showBanner: unityShowBanner,
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
  };

  // 버튼을 누르면 그때 게임을 받는다 (누르기 전에는 그림 한 장만).
  // 한 번 끝까지 받은 기기(브라우저 캐시에 남음)와 홈 화면 앱은 누르지 않아도 바로 시작 — G123처럼 열자마자 게임.
  var play = document.querySelector("#play");
  function start(again) {
    if (play.disabled) return;
    play.disabled = true;
    play.firstChild.textContent = again ? "이어서 여는 중… " : "이솔을 만나러 가는 중… ";
    document.querySelector("#progress").hidden = false;
    document.querySelector("#install-chip").hidden = true;
    progress(again ? "이어서 여는 중" : "게임 받는 중 0%", 0);
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        progress((p < .9 ? (again ? "이어서 여는 중 " : "게임 받는 중 ") : "이솔의 하루를 준비하는 중 ") + Math.round(p * 100) + "%", p);
      }).then(function () {
        started = true;
        store("toq.ready", "1");
        document.querySelector("#loading").remove();
        ball.hidden = false;
        fit();
        keepAwake();
        canvas.focus();
      }).catch(function (message) { showError(message); });
    };
    script.onerror = function () { showError("게임 파일을 받지 못했어요. 새로고침해 주세요."); };
    document.body.appendChild(script);
  }
  play.onclick = function () { start(false); };
  if (isStandalone || store("toq.ready") === "1") start(true);
</script>
</body>
</html>
